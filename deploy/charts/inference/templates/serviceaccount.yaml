{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
  annotations:
    # The IRSA annotation. The role's trust policy names this exact
    # namespace/name pair with StringEquals, so a rename here breaks the
    # credential exchange with an error that mentions only the token.
    eks.amazonaws.com/role-arn: {{ required "serviceAccount.roleArn is required (terraform output irsa_role_arns)" .Values.serviceAccount.roleArn | quote }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: true
{{- end }}
---
{{- if .Values.drift.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.drift.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "drift.serviceAccount.roleArn is required" .Values.drift.serviceAccount.roleArn | quote }}
automountServiceAccountToken: true
{{- end }}
