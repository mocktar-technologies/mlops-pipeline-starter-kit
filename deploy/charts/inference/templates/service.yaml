apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference.labels" . | nindent 4 }}
spec:
  # ClusterIP. Exposure to the outside world is a separate decision made by an
  # Ingress or a Gateway with your organisation's authentication in front of it,
  # not by this chart creating a LoadBalancer with a public address.
  type: ClusterIP
  selector:
    {{- include "inference.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
