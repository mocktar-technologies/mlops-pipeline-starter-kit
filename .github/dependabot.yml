  # No pip ecosystem here, on purpose.
  #
  # The Python locks are compiled from requirements/*.in with uv, with hashes, and
  # with serving.txt as a shared constraint. Dependabot edits the .txt files and
  # leaves the .in files alone, so its pull request creates exactly the drift
  # between what is declared and what is resolved that compiling the locks exists
  # to prevent. Its first run here failed outright, and the pull request it did
  # open failed every check.
  #
  # Python dependencies move by running `make lock`, reading the diff and
  # committing it. That is a deliberate act, which is what a hash-pinned lock file
  # deserves.